<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benimle Çıkar Mısın?</title>
  <!-- Konfeti Efekti Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden; /* Butonun ekran dışına kaçıp kaydırma çubuğu çıkarmaması için */
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    h1 {
      color: #ff4b2b;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      min-height: 50px;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yes-btn {
      background-color: #2ed573;
      color: white;
      box-shadow: 0 4px 10px rgba(46, 213, 115, 0.4);
    }

    #no-btn {
      background-color: #ff4757;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
      position: absolute; /* Ekranda serbestçe kaçabilmesi için */
      touch-action: manipulation;
    }

    /* Tarih Seçimi Bölümü (Başlangıçta Gizli) */
    #date-section {
      display: none;
      margin-top: 20px;
      animation: fadeIn 0.8s ease forwards;
    }

    #date-section p {
      color: #333;
      font-size: 16px;
      margin-bottom: 10px;
    }

    input[type="datetime-local"] {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
      width: 100%;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="question">Benimle çıkar mısın? ❤️</h1>

    <div class="btn-group" id="btn-container">
      <button id="yes-btn">Evet</button>
      <button id="no-btn">Hayır</button>
    </div>

    <!-- Evet'e basılınca açılacak alan -->
    <div id="date-section">
      <p>Harika! O zaman buluşma tarihimizi seç 👇✨</p>
      <input type="datetime-local" id="meeting-date">
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');
    const dateSection = document.getElementById('date-section');
    const question = document.getElementById('question');
    const btnContainer = document.getElementById('btn-container');

    // Hayır butonunu rastgele bir yere kaçıran fonksiyon
    function moveNoButton() {
      // Ekran genişliği ve yüksekliğini al (padding payı bırakarak)
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      // Butonu ekran seviyesine çıkarıp absolute konumlandır
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // Mobil dokunma (touchstart) ve masaüstü (mouseover/click) olaylarını yakala
    noBtn.addEventListener('touchstart', function(e) {
      e.preventDefault(); // Varsayılan dokunma eylemini engelle
      moveNoButton();
    });

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);

    // Evet butonuna basılınca çalışacak fonksiyon
    yesBtn.addEventListener('click', () => {
      // Konfeti patlat
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });

      // Soruyu ve butonları güncelle/gizle
      question.innerText = "Yeeeey! 🎉😍";
      btnContainer.style.display = 'none';
      noBtn.style.display = 'none';

      // Tarih seçme alanını göster
      dateSection.style.display = 'block';
    });
  </script>
</body>
</html>
